# Phase 3/4/5: the observability stack. This one file is worth studying:
# it is a miniature of what an infra team deploys in Kubernetes.

services:
  app:
    build: .
    ports:
      - "8000:8000"   # itw-me's own API + /metrics: http://localhost:8000
    environment:
      # Defaults match running `uvicorn` directly outside Docker: offline,
      # canned adapters, no keys needed. Override any of these the same
      # way you would outside Docker (e.g. `docker compose run -e
      # ITW_ME_FAKE_LLM=0 ...`, or a `.env` file docker-compose picks up
      # automatically) -- container.py reads the exact same variables
      # either way, it has no idea it's in a container.
      - ITW_ME_FAKE_LLM=${ITW_ME_FAKE_LLM:-1}
      - ITW_ME_ENV=${ITW_ME_ENV:-dev}
      - ITW_ME_LLM_BASE_URL=${ITW_ME_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - ITW_ME_MODEL=${ITW_ME_MODEL:-llama3.1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      # "localhost" inside THIS container means "this container," not
      # "the compose network" -- so the bare-host default in container.py
      # (correct for `uvicorn` run directly against a standalone Jaeger)
      # has to be overridden here to Jaeger's compose SERVICE name, which
      # Docker's internal DNS resolves within this network. Same pattern
      # as ITW_ME_LLM_BASE_URL above, for the same reason.
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      - jaeger   # so the app's very first span export attempt, right
                 # after startup, has somewhere to go rather than a few
                 # seconds of expected connection-refused.

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      # Explicit rather than relying on the image's own default: Jaeger
      # has supported OTLP natively since well before this default
      # became implicit in newer image versions, and being explicit here
      # means this file keeps working even against an older pinned image.
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4318:4318"    # OTLP/HTTP receiver -- what this app's exporter sends to
      - "16686:16686"  # Jaeger UI: http://localhost:16686

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"   # Prometheus UI: http://localhost:9090
    depends_on:
      - app   # doesn't block prometheus.yml's scrape target existing;
              # just means `docker compose up` starts app first, so the
              # very first scrape attempt has something to hit rather
              # than a few seconds of expected connection-refused.

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # Grafana UI: http://localhost:3000 (admin/admin)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    # TODO (Phase 6): provision Prometheus as a datasource via
    # ./observability/grafana/ provisioning files instead of clicking
    # through the UI; that's the reproducible way. See phase6_spec.md.
