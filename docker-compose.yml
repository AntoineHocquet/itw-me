# Phase 3: the observability stack. This one file is worth studying:
# it is a miniature of what an infra team deploys in Kubernetes.
#
# TODO(antoine): add an "app" service (build: ., port 8000) once the
# API runs, then uncomment prometheus's dependency on it.

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"   # Prometheus UI: http://localhost:9090

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # Grafana UI: http://localhost:3000 (admin/admin)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    # TODO: provision Prometheus as a datasource via
    # ./observability/grafana/ provisioning files instead of clicking
    # through the UI; that's the reproducible way.
