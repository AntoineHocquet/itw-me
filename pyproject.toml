[project]
name = "itw-me"
version = "0.1.0"
description = "RAG chatbot to interview Antoine. Training project: DDD, hexagonal architecture, observability."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    # phase 2:
    "chromadb",
    "openai",
    "python-dotenv",
    # phase 3:
    # "opentelemetry-api",
    # "opentelemetry-sdk",
    # "opentelemetry-instrumentation-fastapi",
    # "opentelemetry-exporter-prometheus",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
