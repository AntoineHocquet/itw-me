[project]
name = "itw-me"
version = "0.1.0"
description = "RAG chatbot to interview Antoine. Training project: DDD, hexagonal architecture, observability."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    # phase 2:
    "chromadb",
    "openai",
    "python-dotenv",
    # phase 4: manual instrumentation only -- no
    # opentelemetry-instrumentation-fastapi, since every instrument in
    # this codebase is created and recorded by hand (see
    # infrastructure/telemetry.py), not by an auto-instrumentation
    # package patching FastAPI/httpx/etc. under the hood.
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-prometheus",
    # api.py's /metrics route calls prometheus_client directly (not just
    # transitively, via the exporter above) to render the exposition
    # format -- listed explicitly since it's a real, direct import.
    "prometheus-client",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "langfuse"]
# Only needed to actually run with LANGFUSE_PUBLIC_KEY/SECRET_KEY set;
# `dev` above already includes it so tests can import/mock the client
# without hitting the network. See docs/langfuse_spec.md.
langfuse = ["langfuse"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
