# 3) 'description' is a brief summary of the research work
research:
- title: Micromagnetism, Landau-Lifshitz-Gilbert equation and related topics
  period: 2012-2016
  description: |-
    The stochastic Landau-Lifshitz-Gilbert equation was introduced in \cite{landau1935theory} to model the evolution
    of the magnetization of a given ferromagnetic domain \(\mathscr O \subset \mathbb R^n\) for \( 1\le n\le 3\).
    It takes the form of the SPDE
    \begin{equation}
    \label{SLLG}%\tag{SLLG}
    d u_t=\left(\beta u_t\times H_{\mathrm{eff}}(u_t)-\alpha u_t\times (u_t\times H_{\mathrm{eff}}(u_t))\right) dt + \epsilon u_t\times d W_t,\quad |u_t(\omega ,x)|_{\mathbb R^3}\equiv 1
    \end{equation}
    on \( (0,T]\times \mathscr O\),
    where the effective field \( H_{\mathrm{eff}}(u)=-\nabla E(u)\), \( E\) being the total energy of the system
    (the unknown \(u_t(x,\omega)\) takes values in the unit sphere).
    Understanding the effect of the noise term \( dW\) (modelizing thermal fluctuations) is an important mathematical question, for instance to study long term stability properties of magnetized materials (such as information storage devices, see e.g.\ \cite{kohn2005magnetic}).
    Formally, the case when \( E=\frac12\int |\nabla u|^2dx \) and \( \alpha=1\gg|\beta|\) reduces to the \textit{stochastic harmonic map flow}
    \begin{equation}
    \label{SHMF}%\tag{SHMF}
    d u_t=\left(\Delta u_t+u_t|\nabla u_t|^2\right) dt + \epsilon u_t\times d W_t,\quad |u_t(\omega ,x)|_{\mathbb R^3}\equiv 1\,,
    \end{equation}
    which was originally studied by Eells and Sampson in \cite{eells1964harmonic} when \( \epsilon=0\) to construct harmonic maps between two manifolds.
    It is related to a number of physical models displaying spherical constraints (including Ericksen-Leslie system for liquid crystals \cite{de2021existence} or Funaki's motion of a random string \cite{bruned2022geometric}).
    An important open problem for \eqref{SLLG}-\eqref{SHMF} when \( d\ge2\) is to understand the blow-up behaviour of solutions in presence of noise, as was partly addressed in my contributions \cite{alouges2014semi,hocquet2015landau,hocquet2018struwe,hocquet2019finite,de2021existence}.
    A few years ago, Pierre Rapha\"el and his co-authors showed that the deterministic harmonic map flow explosion is stable under small perturbations of the initial data \cite{raphael2013stable}, in an equivariance-preserving direction, which is also the type of symmetry I considered in \cite{hocquet2019finite} when I showed the existence of singular solutions for a (well-chosen) degenerate noise term.
    This contrasts with \cite{merle2013blow} where it is shown existence, but instability, of initial data leading to the explosion for the deterministic version of \eqref{SLLG}. It appears that the instability is due to the necessary extra degree of freedom of the solutions, compared to \eqref{SHMF} for which a reduction to a scalar problem via the equivariant ansatz is possible.
    This leads to the conjecture that a fully non-degenerate noise term should prevent the explosion phenomenon to occur, which is a problem I would like to address in the future.
- title: Rough partial differential equations
  period: 2016-2019
  description: |-
    Introduced by Lyons in \cite{lyons1998differential,lyons2002system}, rough paths allow to describe solutions of ordinary differential equations controlled by an arbitrary irregular signal.
    Rough \textit{partial} differential equations are special cases of singular PDEs, where the irregularity occurs in a particular direction (usually the ``time'' variable).
    Despite this specificity, they are relevant in a number of physical models where the irregularity appears as a stochastic process indexed by a time variable (the most common example is Brownian motion).
        
    Fixing the sample parameter \( \omega\in \Omega\), one may describe the models \eqref{SLLG}-\eqref{SHMF} as particular instances of the generic RPDE%
    \footnote{Here $A_\cdot $ is a family of (possibly non-linear) operators, $\mathbf X^i,i=0,\dots d\in \mathbb N\cup\{\infty\}$ is a rough path with values in some functional space (for the spatial variable $x\in \mathbb R^n$), while \( F \) and \( N \) are non-linearities. }
    \begin{equation}
      \left\{
        \begin{aligned}\label{ansatz_RPDE}
          &du_t -(A_t(u_t)u_t + N_t(u_t))dt = \sum\nolimits_{i=0}^d F_i(u_t)d\mathbf X^i_t,\quad \text{on}\enskip [0,T]\times \mathbb R^n\,,
          \\
          &u_0\in L^p(\mathbb R^n).
        \end{aligned}
      \right.
    \end{equation}
    An important aim of my previous research was to develop a general methodology to obtain \textit{a priori estimates} for partial differential
    equations of this type, as partly carried out in \cite{hocquet2018energy,hocquet2020ito,hocquet2020generalized,hocquet2021quasilinear}.
    A different -- though related -- purpose is to find rough counterparts of functional analytic techniques which fail in the setting of It\^o's
    stochastic calculus, due to regularity or measurability issues. This direction was partly explored in the recent contributions
    \cite{gerasimovics2021non,hocquet2022weak,hocquet2022quasilinear}, where a generalization of the Sewing Lemma in operator algebras was introduced.
- title: Mean field control in neuroscience
  period: 2019-2022
  description: |-
    FitzHugh proposed in 1961 a three-dimensional equation to describe the temporal evolution of a neuron subjected to an external current $X\colon [0,T ]\to \mathbb R$.
    This model generalizes well to the case of a \textit{network} of interacting neurons (e.g.\ a small area of the brain), in which case the evolution of the $i$-th neuron \( Y^i_t=(v^i_t,w^i_t,c^i_t)\), \(i=1,\dots N\)
    is governed by
    \begin{equation}\label{FHN}%\tag{FHN}
      \left\{
        \begin{aligned}
          &dv^i_t=\Big(v^i_t-\frac{(v^ i_t)^3}{3}-w_t^i - \frac{1}{N}\sum\nolimits_{j=1}^N (v^i_t-1)c^j_t\Big)dt +d X^i_t
          \\
          &\quad\quad  
          - \frac{1}{N}\sum\nolimits_{j=1}^N(v^i_t-1)c^j_tdB_t^i
          \\
          &dw^i_t=(v^i_t+1-w^i_t)dt\enskip ,
          \\
          &dc^i_t=(S (v_t^i)(1-c_t^i)-c_t^i)dt
        \end{aligned}
      \right.
    \end{equation}
    where \( B\) is Brownian noise coming from the interactions,
    \( S(v)=\frac{1}{1+\exp(-v)} \), while  \( dX_t= \alpha_t dt +d\tilde B_t \) is a control for an independent brownian \( \tilde B\) (external noise).
    The mathematical treatment of \eqref{FHN} (and of its mean-field limit \eqref{rough_SDE}), is still in its infancy because the coefficients are not Lipschitz.
    From the point of view of concrete applications, the model \eqref{FHN} is motivated by the treatment of neural diseases (in this model, \( X_t \) models an external current whose purpose is to generate a given brain response).
    Despite our contribution \cite{hocquet2020optimal} the problem of approximation of an optimal control (for a given cost functional \( J(X)\)) remains largely open.

    A current research topic is the weak error analysis when the Wiener measure is replaced by a simpler probability measure which nevertheless preserves some quantities of interest. An example is the \textit{cubature} method introduced by Lyons and Victoir \cite{lyons2004cubature}. An attempt in this direction was made in \cite{hocquet2022weak} (with the approximation of the control problem for \eqref{FHN} as a horizon). We derived weak convergence rates for classical SDEs from a novel argument, based on the multiplicative sewing lemma of \cite{gerasimovics2021non}. It seems to be flexible enough to include the full ansatz \eqref{rough_SDE}, which I want to address in the future.

- title: Hybrid rough and stochastic differential equations
  period: 2022-2024
  description: |- 
    When \( N\gg 1\), the chaos propagation result of \cite{baladron2012mean}
    implies that the dynamics of a single neuron $Y_t$ can be approximated by a
    McKean-Vlasov equation of the form
    \begin{equation}\label{rough_SDE}%\tag{RSDE}
    \left\{
    \begin{aligned}&dY_t=b(Y_t,\mu_t)dt+\sigma(Y_t,\mu_t)dB_t+f(Y_t,\mu_t)d\mathbf X_t\quad \\text{on }(s,T],
    \\& \\mu_t=\\mathcal L(Y_t), \\
    \\& Y_s=\\xi.
    \end{aligned}
    \right.
    \end{equation}
    where for fixed \( t\) the term \( \mu_t\) denotes the law of the random variable \( Y_t\),
    $b$ is a non-linearity, $\sigma$ a diffusion matrix and $B$ a standard multidimensional
    Brownian motion, while \( \mathbf X \) is a given control.
    The ansatz \eqref{rough_SDE} actually covers a wide variety of applications which go much
    beyond control theory. For instance, in the theory of filtering, the input \(\mathbf X\)
    can be thought as a frozen realization of an additional, observed source of noise. 
    In recent works with Peter Friz and Khoa L\\^e \\cite{friz2021rough,friz2022mckean},
    we have developed a notion of stochastic rough differential equation which reduces
    exactly to an It\^o equation (resp.\ to a rough differential equation) when
    \(f\) (resp.\ \(\sigma\) ) is taken equal to zero.  In doing so, we have been
    forced to revise the main concepts of classical stochastic and rough analysis
    and to introduce the corresponding mixed objects.

